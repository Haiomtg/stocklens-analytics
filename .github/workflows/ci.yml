name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Smoke-test the demo pipeline
        run: |
          python -m stocklens.ingest.sample --db /tmp/sample.db --transactions /tmp/tx.csv
          python -m stocklens.reports.weekly --db /tmp/sample.db --transactions /tmp/tx.csv --out /tmp/report.html
