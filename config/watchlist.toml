# Public watchlist. Safe to commit - it lists what you WATCH, not what you OWN.
# market: "US" | "ASX" | "VN"
# Yahoo symbols: US = AAPL, ASX = BHP.AX, benchmark ASX 200 = ^AXJO
# VN symbols use the plain ticker (VRE, GAS, ...); VN-Index = VNINDEX
# Vietnam data comes from CSV files you export (data/vn_csv/), so the VN lines below are off by default.
# Your real Vietnamese list lives in config/private.toml (git-ignored).

start_date = "2018-01-01"

[benchmarks]
US = "^GSPC"
ASX = "^AXJO"
# VN = "VNINDEX"

